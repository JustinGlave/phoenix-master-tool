name: ci

# Family-standard CI workflow per the Phoenix Tools Unified Standard
# (phoenix-commons/docs/ui-platform-baseline-v1/PHOENIX_APP_STANDARD_BASELINE_V1.md).
# Runs alongside the existing test.yml (ubuntu matrix). Both must
# pass on the retrofit branch tip before merge.
#
# Generated at Wave 8a B1 (2026-05-26, operator-approved early-open).
# Decision #3 (WAVE_8A_KICKOFF_DECISION_RECORD.md): preserve test.yml +
# add parallel family-standard ci.yml.

on:
  push:
    branches: [main, phase-8a-valvemaster-retrofit]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: ci (windows / py3.12 / commons-backed)
    runs-on: windows-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: phoenix_commons import smoke
        run: python -c "import phoenix_commons; print('phoenix_commons', phoenix_commons.__version__)"

      - name: compileall
        run: python -m compileall -q .

      - name: pytest
        run: pytest -q tests/
