name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unittest:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # phoenix_commons is consumed as the `commons/` git submodule (Wave 8a B1).
      # The updater unit tests import `from updater import ...`, which now imports
      # `phoenix_commons.updater` (pure-Python client + installer — no PySide6 at
      # import time). Exposing the submodule's src/ on PYTHONPATH keeps this
      # lightweight cross-version matrix fast (no heavy PySide6 install needed).
      - name: Run validation + updater unit tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: commons/src

      - name: Run baseline self-test
        run: |
          python -c "from phoenix_master_backend import run_baseline_debug_benchmark; print(run_baseline_debug_benchmark())"
